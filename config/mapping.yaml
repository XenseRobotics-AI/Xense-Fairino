# Dedicated low-speed indoor mapping profile. Motor/navigation settings live elsewhere.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    map_update_interval: 1.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.08726646259971647  # radians, 5 degrees
    use_scan_matching: true
    use_scan_barycenter: false  # Select keyframes by robot motion, not visible scene changes.
    throttle_scans: 1
    min_laser_range: 0.1
    max_laser_range: 20.0
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    transform_publish_period: 0.05
    scan_queue_size: 5
    scan_buffer_size: 70
    scan_buffer_maximum_scan_distance: 10.0
