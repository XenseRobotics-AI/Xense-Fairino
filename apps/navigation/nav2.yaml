planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: fairino_straight_planner::StraightLinePlanner
      straight_line_enabled: true
      tolerance: 0.05
      allow_unknown: false
      downsample_costmap: false
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 3.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.6
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 60.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      stateful: false
      trans_stopped_velocity: 0.005
      rot_stopped_velocity: 0.01
    FollowPath:
      plugin: fairino_lookahead_controller::HolonomicLookaheadController
      heading_mode: hold_initial
      lookahead_distance: 0.2
      projection_search_distance: 1.0
      position_gain: 0.8
      heading_gain: 1.5
      coordination_linear_speed: 0.02
      coordination_angular_speed: 0.04
      coordination_wait_timeout: 15.0
      coordination_direction_tolerance: 0.2
      transform_tolerance: 0.3
      collision_horizon: 1.0
      collision_step: 0.05
      max_linear_speed: 0.1
      max_angular_speed: 0.2
      linear_acceleration: 0.2
      angular_acceleration: 0.4
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      control_period: 0.3333333333333333
      chassis_feedback_timeout: 0.4
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.05
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front back
        footprint_clearing_enabled: true
        front:
          topic: /front/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.5
          observation_persistence: 0.0
          obstacle_min_range: 0.1
          obstacle_max_range: 12.0
          raytrace_min_range: 0.1
          raytrace_max_range: 15.0
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
        back:
          topic: /back/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          expected_update_rate: 0.5
          observation_persistence: 0.0
          obstacle_min_range: 0.1
          obstacle_max_range: 12.0
          raytrace_min_range: 0.1
          raytrace_max_range: 15.0
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      rolling_window: true
      width: 4
      height: 4
      track_unknown_space: true
      footprint: '[[-0.375, -0.3], [0.375, -0.3], [0.375, 0.3], [-0.375, 0.3]]'
      footprint_padding: 0.02
