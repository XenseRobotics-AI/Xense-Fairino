# Generated by tools/build_navigation.py; edit profile.py, then regenerate.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.05
      allow_unknown: false
      downsample_costmap: false
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 60.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.1
      min_vel_x: -0.06
      max_vel_x: 0.06
      min_vel_y: -0.06
      max_vel_y: 0.06
      max_vel_theta: 0.1
      max_speed_xy: 0.06
      min_speed_xy: 0.0
      min_speed_theta: 0.0
      acc_lim_x: 0.2
      acc_lim_y: 0.2
      acc_lim_theta: 0.4
      decel_lim_x: -0.2
      decel_lim_y: -0.2
      decel_lim_theta: -0.4
      vx_samples: 5
      vy_samples: 5
      vtheta_samples: 7
      sim_time: 3.0
      linear_granularity: 0.02
      angular_granularity: 0.02
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.005
      xy_goal_tolerance: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - ObstacleFootprint
      - RotateToGoal
      - Oscillation
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: -1.0
