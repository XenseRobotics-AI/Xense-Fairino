[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairino-slam"
version = "0.1.0"
description = "Fairino ROS 2 mapping, localization and guarded planar navigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pexpect>=4.9,<5", "PyYAML>=6,<7", "numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "setuptools>=68", "wheel>=0.45,<1"]

[project.scripts]
fairino-slam = "fairino_slam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fairino_slam*"]
namespaces = false

[tool.setuptools.package-data]
fairino_slam = ["resources/models/*", "resources/slam_toolbox/*"]
