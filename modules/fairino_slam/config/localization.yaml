# Managed AMCL profile for the holonomic chassis. Loaded only on explicit start.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::OmniMotionModel
    set_initial_pose: false
    always_reset_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.3
    first_map_only: false
    update_min_d: 0.1
    update_min_a: 0.08726646259971647
    min_particles: 500
    max_particles: 2000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.2
    resample_interval: 1
